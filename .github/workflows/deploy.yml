# Publishes the website to Cloudflare every time the main branch changes.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID - the account ID of the Cloudflare account that holds aidfolio.org
# Until both secrets exist, the deploy step is skipped rather than failing.
name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Explain missing secrets
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::Deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions, then run this workflow again."
      - name: Deploy Worker
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
