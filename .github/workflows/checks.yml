name: Checks
on: [pull_request, push]
permissions: { contents: read }
jobs:
  accessibility-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Serve the site
        run: |
          npx --yes http-server@14.1.1 -p 8080 -s public &
          sleep 5
      - name: Accessibility (WCAG 2 AA)
        run: npx --yes pa11y-ci@3.1.0
      - name: Broken links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          output: lychee/out.json
          format: json
          args: --no-progress --exclude-mail --accept '200..=299,403,429' --max-retries 3 --timeout 30 public/index.html README.md docs
      - name: Report link check results
        if: always()
        run: |
          f=lychee/out.json
          if [ ! -s "$f" ]; then echo "::warning title=Link check::report file missing or empty"; exit 0; fi
          echo "::notice title=Link check summary::$(jq -c '{total,successful,errors,timeouts,redirects,excludes,unknown}' "$f" 2>/dev/null || head -c 500 "$f")"
          jq -r '(.error_map // .fail_map // {}) | to_entries[] | .key as $file | .value[] | "\($file): \(.url) -> \(.status.text // .status.code // .status | tostring)"' "$f" 2>/dev/null | head -50 | while IFS= read -r line; do echo "::warning title=Link problem::$line"; done
