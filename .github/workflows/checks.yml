name: Checks
on: [pull_request, push]
permissions: { contents: read }
jobs:
  accessibility-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Serve the site
        run: |
          npx --yes http-server@14.1.1 -p 8080 -s public &
          sleep 5
      - name: Accessibility (WCAG 2 AA)
        run: npx --yes pa11y-ci@3.1.0
      - name: Broken links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          output: lychee/out.md
          args: --no-progress --exclude-mail --accept '200..=299,403,429' --max-retries 3 --timeout 30 public/index.html README.md docs
      - name: Report link check results
        if: always()
        run: |
          echo "lychee exit code: ${{ steps.lychee.outputs.exit_code }}"
          if [ -f lychee/out.md ]; then
            echo "::notice title=Link check summary::$(grep -E '^\|' lychee/out.md | tr -d '|' | tr -s ' ' | tr '\n' ';')"
            grep -E '^\s*[*-] ' lychee/out.md | sed 's/^/::warning title=Link problem::/' || true
          else
            echo "::warning title=Link check::no report file"
          fi
