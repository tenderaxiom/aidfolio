name: Checks
on: [pull_request, push]
permissions: { contents: read }
jobs:
  accessibility-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Serve the site
        run: |
          npx --yes http-server@14.1.1 -p 8080 -s public &
          sleep 5
      - name: Accessibility (WCAG 2 AA)
        run: npx --yes pa11y-ci@3.1.0
      - name: Broken links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          output: lychee/out.md
          args: --no-progress --exclude-mail --accept '200..=299,403,429' --max-retries 3 --timeout 30 public/index.html README.md docs
      - name: Report link check results
        if: always()
        run: |
          if [ -s lychee/out.md ]; then
            msg=$(head -c 6000 lychee/out.md | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=Link check report (exit ${{ steps.lychee.outputs.exit_code }})::$msg"
          else
            echo "::warning title=Link check::report file missing or empty"
          fi
